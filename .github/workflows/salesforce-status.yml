name: Salesforce Status Monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore cached state
        uses: actions/cache@v4
        with:
          path: state.json
          key: salesforce-state-${{ github.run_id }}
          restore-keys: |
            salesforce-state-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run status check
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python check_status.py
